<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table tag</title>
</head>

<body>
    <h1>Table in HTML </h1>
    <table border =1 >
        <caption>Sutdent details of LBEF.</caption>
        <tr>
            <th>Name</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>Prajwal</td>
            <td>20</td>
    </tr>
        <tr>
           <td>Nikesh</td>
           <td>18</td>        
        </tr>
        <tr></tr>
        <tr></tr>
    </table>
</body>
</html>
<!--- 
<table> - defines table in html.
    <tr> - defines individual row in table.
    <th> - represents data cell in table heading.
    <td> - represents data cell in table body.
        <caption> - used to name the table.


--->
